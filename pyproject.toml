[project]
name = "model-efficiency-lab"
version = "0.1.0"
description = "Research lab for model efficiency: pruning, quantization, distillation on CIFAR-10"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "pandas",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efflab"]
