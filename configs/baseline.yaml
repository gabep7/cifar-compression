experiment: baseline_resnet18
seed: 42
device: auto
data:
  name: cifar10
  root: data
  batch_size: 512
  num_workers: 2
  download: false
  skip_integrity_check: true
model:
  name: resnet18
  num_classes: 10
  pretrained: false
train:
  epochs: 50
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_milestones: [30, 40]
  lr_gamma: 0.1
  label_smoothing: 0.0
paths:
  checkpoint_dir: checkpoints
  results_dir: results/raw
